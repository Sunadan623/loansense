version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: loansense
      POSTGRES_PASSWORD: loansense123
      POSTGRES_DB: loansense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: loansense
      MONGO_INITDB_ROOT_PASSWORD: loansense123
      MONGO_INITDB_DATABASE: loansense_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://loansense:loansense123@postgres:5432/loansense_db
      MONGO_URL: mongodb://loansense:loansense123@mongodb:27017/loansense_db
    depends_on:
      - postgres
      - mongodb
    volumes:
      - ./apps/api:/app

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
