version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: loansense
      POSTGRES_PASSWORD: loansense123
      POSTGRES_DB: loansense_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: loansense
      MONGO_INITDB_ROOT_PASSWORD: loansense123
      MONGO_INITDB_DATABASE: loansense_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://loansense:loansense123@postgres:5432/loansense_db
      MONGO_URL: mongodb://loansense:loansense123@mongodb:27017/loansense_db
      KAFKA_BROKER: kafka:29092
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - mongodb
      - kafka
      - redis
    volumes:
      - ./apps/api:/app

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
